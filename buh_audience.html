<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>Аудитория линейки «Бухгалтерия» — аналитический дашборд</title>
<style>
:root{
  --bg:#F6F6F8; --card:#FFFFFF; --line:#E5E5EA; --soft:#F1F1F5; --soft-2:#FAFAFC;
  --ink:#16161A; --ink2:#5C5C68; --ink3:#8E8E9A;
  --accent:#4C5BD4; --accent-soft:#EEF0FD; --accent-line:#CFD5F7;
  --warn:#9A6200; --warn-bg:#FDF4E3; --warn-line:#F0DFBC;
  --p0:#7A6BD1; --p1:#0E9B8A; --p2:#3568D4; --p3:#C9812F; --p4:#BC4A7C;
  --r:12px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f); background:var(--bg); color:var(--ink);
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;border-right:1px solid var(--line);
  background:#FCFCFD;padding:20px 14px;display:flex;flex-direction:column;gap:18px;overflow-y:auto
}
.brand{padding:0 8px}
.brand h1{font-size:14.5px;line-height:1.3;margin:0 0 4px;letter-spacing:-.01em}
.brand p{margin:0;font-size:11.5px;color:var(--ink3);line-height:1.45}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{
  display:flex;align-items:center;gap:9px;text-align:left;border:0;background:transparent;
  padding:7px 9px;border-radius:7px;font-size:13px;color:var(--ink2);width:100%
}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:560}
.nav .ix{font-size:10.5px;color:var(--ink3);width:11px;flex:none}
.nav button.on .ix{color:var(--accent)}
.sidefoot{margin-top:auto;padding:0 8px;font-size:11px;color:var(--ink3);line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}

/* ---------- filter bar ---------- */
.fbar{
  position:sticky;top:0;z-index:20;background:rgba(246,246,248,.86);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:10px 26px
}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:11.5px;color:var(--ink3);margin-right:2px}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:3.5px 11px;font-size:12.5px;color:var(--ink2);white-space:nowrap
}
.chip:hover{border-color:#D3D3DB}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.p0.on{background:var(--p0);border-color:var(--p0)}
.chip.p1.on{background:var(--p1);border-color:var(--p1)}
.chip.p2.on{background:var(--p2);border-color:var(--p2)}
.chip.p3.on{background:var(--p3);border-color:var(--p3)}
.chip.p4.on{background:var(--p4);border-color:var(--p4)}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.pop{position:relative}
.pop>summary{
  list-style:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:3.5px 11px;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap
}
.pop>summary::-webkit-details-marker{display:none}
.pop[open]>summary{border-color:var(--accent);color:var(--accent)}
.pop.set>summary{background:var(--ink);border-color:var(--ink);color:#fff}
.popbody{
  position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:320px;max-height:60vh;overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;
  box-shadow:0 10px 30px rgba(20,20,40,.10)
}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;font-size:12.5px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt input{margin:2px 0 0}
.opt .c{margin-left:auto;color:var(--ink3);font-size:11.5px;padding-left:10px}
.fstat{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap}
.fstat b{font-weight:600;color:var(--ink)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-size:12.5px;padding:3px 4px}

/* ---------- content ---------- */
.wrap{padding:22px 26px 70px;max-width:1220px}
.shead{margin:0 0 4px;font-size:21px;letter-spacing:-.02em;font-weight:620}
.sdesc{margin:0 0 18px;color:var(--ink2);font-size:13px;max-width:78ch}
.sdesc code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:11.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card.tight{padding:13px 15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.shell{grid-template-columns:1fr}.side{position:static;height:auto}}
.mt{margin-top:14px}.mt24{margin-top:24px}

.ctitle{font-size:12.5px;font-weight:600;margin:0 0 2px;letter-spacing:-.005em}
.cbase{font-size:11px;color:var(--ink3);margin:0 0 11px}
.hint{font-size:11.5px;color:var(--ink3);margin:10px 0 0;line-height:1.45}

/* KPI */
.kpi .v{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:2px 0 3px}
.kpi .l{font-size:12px;color:var(--ink2);line-height:1.35}
.kpi .s{font-size:11px;color:var(--ink3);margin-top:5px}

/* segmented product bar */
.segbar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.segbar button{border:0;position:relative;color:#fff;font-size:12px;font-weight:560;padding:0;transition:filter .15s}
.segbar button:hover{filter:brightness(1.07)}
.segbar button.dim{filter:grayscale(.75) opacity(.45)}
.seglegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink2)}
.seglegend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:3px;display:inline-block}

/* bar list */
.bl{display:flex;flex-direction:column;gap:7px}
.bl .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline}
.bl .lb{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .vv{font-size:12px;color:var(--ink2);white-space:nowrap}
.bl .vv b{color:var(--ink);font-weight:600}
.bl .track{grid-column:1/-1;height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:-3px}
.bl .fill{height:100%;border-radius:3px;background:var(--accent)}
.bl .row.muted .lb,.bl .row.muted .vv{color:var(--ink3)}
.bl .row.muted .fill{background:#C9C9D2}
.warnmark{color:var(--warn);font-size:10.5px;margin-left:3px}

/* table */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--soft)}
th{font-size:11px;color:var(--ink3);font-weight:500;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--soft-2)}
td.cell{position:relative}
td .n{font-weight:560}
td .pc{color:var(--ink3);font-size:11px;margin-left:5px}
tr.grp td{background:var(--soft-2);font-size:11px;color:var(--ink3);font-weight:560;padding-top:9px;border-bottom:1px solid var(--line)}
.tscroll{overflow-x:auto}
.delta{font-size:11px}
.up{color:#0E7C63}.down{color:#B4485F}
.badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:5px;background:var(--soft);color:var(--ink2);margin-left:5px;vertical-align:1px}
.badge.up{background:#E3F4EF;color:#0E7C63}
.badge.down{background:#FCECEF;color:#B4485F}

/* layers: fact / interpretation / hypothesis */
.layer{border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.5}
.layer h4{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.02em}
.layer ul{margin:0;padding-left:16px}
.layer li{margin-bottom:5px}
.layer li:last-child{margin-bottom:0}
.l-fact{background:var(--soft-2);border:1px solid var(--line)}
.l-fact h4{color:var(--ink2)}
.l-int{background:var(--accent-soft);border:1px solid var(--accent-line)}
.l-int h4{color:var(--accent)}
.l-hyp{background:var(--warn-bg);border:1px solid var(--warn-line)}
.l-hyp h4{color:var(--warn)}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);color:#6B4A10;border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.5}
.note.plain{background:var(--soft-2);border-color:var(--line);color:var(--ink2)}
.quote{font-size:12.5px;color:var(--ink2);border-left:2px solid var(--line);padding:2px 0 2px 11px;margin:0 0 9px;line-height:1.5}
.quote:last-child{margin-bottom:0}

/* product tabs */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ptab{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;text-align:left;min-width:118px}
.ptab .t{font-size:13px;font-weight:580;display:block}
.ptab .n{font-size:11px;color:var(--ink3)}
.ptab.on{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.ptab.on .t{color:currentColor}

/* trajectory */
.traj{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;border-top:1px solid var(--soft)}
.traj>div{padding:11px 0;border-bottom:1px solid var(--soft)}
.traj .k{font-size:11px;color:var(--ink3);padding-right:12px}
.traj .v{font-size:12.5px;line-height:1.5}
.pill{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--soft-2)}
.pill.ok{background:#E8F5F1;border-color:#C6E7DD;color:#0E7C63}
.pill.part{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.hd{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.hd h3{margin:0;font-size:15px;letter-spacing:-.01em}
.hd .sub{font-size:11.5px;color:var(--ink3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- подсказки ---------- */
.q{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;
   border:1px solid var(--line);color:var(--ink3);font-size:9.5px;font-weight:600;margin-left:6px;
   cursor:help;vertical-align:1px;background:var(--card);flex:none;user-select:none}
.q:hover,.q:focus{border-color:var(--accent);color:var(--accent)}
#tip{position:fixed;z-index:200;max-width:330px;background:#1E1E24;color:#F0F0F4;font-size:11.5px;
     line-height:1.5;padding:9px 12px;border-radius:9px;box-shadow:0 10px 28px rgba(16,16,32,.22);
     pointer-events:none;opacity:0;transition:opacity .12s;left:0;top:0}
#tip.on{opacity:1}

/* ---------- укрупнённые сегменты ---------- */
.segrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.schip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
       border-radius:999px;padding:4px 13px 4px 10px;font-size:12.5px;color:var(--ink2)}
.schip .dot{width:9px;height:9px;border-radius:3px}
.schip .c{color:var(--ink3);font-size:11.5px}
.schip.on{color:#fff;border-color:transparent}
.schip.on .c{color:rgba(255,255,255,.72)}
.schip.on .dot{background:rgba(255,255,255,.85)!important}
.segband{display:flex;height:30px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.segband div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:560}
tr.seghead td{background:#F4F5F9;font-size:11px;font-weight:600;color:var(--ink2);padding:8px;
              border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr.seghead td .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}

/* ---------- цитаты ---------- */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:900px){.qgrid{grid-template-columns:minmax(0,1fr)}}
.qc{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--soft-2);font-size:12.5px;line-height:1.5}
.qc .txt{color:var(--ink)}
.qc .meta{margin-top:7px;font-size:10.5px;color:var(--ink3);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.qc .meta .sw{width:7px;height:7px;border-radius:2px;display:inline-block}
.qmore{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--ink2)}
.qmore:hover{border-color:var(--accent);color:var(--accent)}
.grptog{border:0;background:transparent;padding:0;font-size:11px;font-weight:560;color:var(--ink2);letter-spacing:.01em}
.grptog:hover{color:var(--accent)}

/* закреплённая шапка длинной таблицы: прокручивается только тело */
.tbox{max-height:calc(100vh - 300px);min-height:220px;overflow:auto;border-top:1px solid var(--line);margin-top:4px}
.tbox table{border-collapse:separate;border-spacing:0}
.tbox th{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:0;box-shadow:inset 0 -1px 0 var(--line)}
.tbox td{border-bottom:1px solid var(--soft)}
.tbox tr.grp td,.tbox tr.seghead td{border-top:0}

.fgroup{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.frow,.segrow{row-gap:8px}
@media(max-width:1000px){.fgroup{flex-wrap:wrap}}

</style>
</head>

      `<div class="track"><div class="fill" style="width:${Math.max(1, 100 * x.n / max)}%${(o.color || CURCOL) ? ';background:' + (o.color || CURCOL) : ''}"></div></div></div>`;
  }).join('') + '</div>';
}
const qm = t => t ? `<span class="q" tabindex="0" data-tip="${esc(t)}">?</span>` : '';
function card(title, base, body, tip) {
  return `<div class="card"><div class="ctitle">${title}${qm(tip)}</div><div class="cbase">${base}</div>${body}</div>`;
}

/* ---------- цитаты покупателей ---------- */
function quotesCard(o) {
  o = o || {};
  let q = QUOTES.filter(x =>
    (o.p === undefined ? (!S.prod.size || S.prod.has(x.p)) : x.p === o.p) &&
    (!S.bt.size || S.bt.has(x.b)) && (!S.seg.size || S.seg.has(x.s)));
  const total = q.length;
  if (!total) return '';
  const per = 6, pages = Math.ceil(total / per), pg = S.qpage % pages;
  const show = q.slice(pg * per, pg * per + per);
  return `<div class="card"><div class="ctitle">Голоса покупателей${qm('Дословные ответы на вопрос «Что подтолкнуло вас начать учиться?». Показаны только содержательные ответы; персональные данные не выгружались. Подборка подстраивается под фильтры.')}</div>
    <div class="cbase">${total} цитат в текущем срезе${pages > 1 ? ` · показаны ${pg * per + 1}–${pg * per + show.length}` : ''}</div>
    <div class="qgrid">${show.map(x => `<div class="qc"><div class="txt">«${esc(x.t)}»</div>

const S5_RESID = { A: { 0: '↓', 3: '↑' }, C: { 0: '↑' }, D: { 0: '↓', 2: '↑', 4: '↓' }, G: { 0: '↑', 2: '↓', 3: '↓' }, H: { 0: '↑', 1: '↑', 2: '↓' }, I: { 2: '↓', 4: '↑' }, Y: { 4: '↑' } };
const NOT_SEGMENT = ['I', 'J', 'K', 'Y', 'Z'];

function secTypes() {
  CURCOL = null;
  const rs = baseRows(), N = rs.length;
  const pN = PNAME.map((_, i) => inProd(rs, i).length);
  const unfiltered = N === NTOT;
  const sc = cSeg(rs);

  function typeRow(k, i) {
    const sub = rs.filter(r => r.b === i), n = sub.length;
    const share = 100 * n / N;
    const cells = PNAME.map((_, p) => {
      const v = cnt(sub, r => r.p === p), base = pN[p];
      const share_p = base ? 100 * v / base : 0;
      const d = share_p - share;
      const resid = unfiltered && S5_RESID[k] && S5_RESID[k][p];
      const a = base ? (.03 + .30 * (share_p / Math.max(1, 40))) : 0;
      return `<td class="cell" style="background:rgba(76,91,212,${Math.min(.33, a).toFixed(3)})">
        <span class="n">${v}</span>${mark(v)}<span class="pc">${base ? ru(share_p.toFixed(1)) + '%' : '—'}</span>
        ${resid ? `<span class="badge ${resid === '↑' ? 'up' : 'down'}">${resid}</span>` : ''}
        <div class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${base ? pp(d) + ' п.п.' : ''}</div></td>`;
    }).join('');
    const nseg = NOT_SEGMENT.includes(k);
    return `<tr><td${nseg ? ' style="color:var(--ink3)"' : ''}><b>${k}.</b> ${esc(D.bt.labels[i])}${nseg ? '<span class="badge" title="Исследование не считает эту группу содержательным сегментом">не сегмент</span>' : ''}</td>
      <td><span class="n">${n}</span>${mark(n)}</td><td>${pct(n, N)}</td>${cells}</tr>`;
  }

  const body = [0, 1, 2, 3].map(sg => {
    const head = `<tr class="seghead"><td colspan="${3 + PNAME.length}"><span class="sw" style="background:${SEGC[sg]}"></span>${SEGL[sg]} — ${sc[sg]} анкет · ${pct(sc[sg], N)}</td></tr>`;
    return head + D.bt.keys.map((k, i) => BT2SEG[k] === sg ? typeRow(k, i) : '').join('');
  }).join('');

  return `
  <h2 class="shead">Типы покупателей</h2>
  <p class="sdesc">Тринадцать задач, с которыми люди приходят на курсы, и карта того, где какая встречается. Отвечает на вопросы: какие группы покупателей вообще есть, насколько каждая крупная, в каком продукте она попадается чаще обычного, а в каком почти не встречается.<span class="q" tabindex="0" data-tip="Каждая анкета отнесена ровно к одному типу — по главной задаче. Это не персоны, а группы анкет с одной доминирующей задачей. В ячейке: число анкет, доля от числа покупателей продукта и отклонение от доли этого типа по всей линейке. Фильтры по продукту, группе и типу здесь не применяются, иначе таблица схлопывается; фильтры по возрасту и занятости действуют.">?</span></p>

  <div class="card">
    <div class="ctitle">Размер типа и распределение по продуктам${qm('В ячейке: число анкет, доля от N продукта и отклонение от доли типа по линейке. ' + (unfiltered ? 'Значки ↑ и ↓ — над- и недопредставленность по скорректированным остаткам χ² из исследования (|z| > 2 и n ≥ 5). χ² типы × продукты = 211,7; df = 48; p < 0,001.' : 'Значки ↑ и ↓ исследования скрыты: они рассчитаны на полной выборке из 975 анкет.'))}</div>
    <div class="cbase">База: ${N} анкет${N !== NTOT ? ' (срез)' : ''}</div>
    <div class="tbox"><table><thead><tr><th>Тип покупателя</th><th>n</th><th>% от базы</th>${PNAME.map((l, i) => `<th style="color:${PCOL[i]}">${l}<br><span style="font-weight:400">N=${pN[i]}</span></th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
  </div>

  <div class="note mt">Группы I, J, K, Y и Z исследование не считает содержательными сегментами. «Повысить знания без контекста» (I) — крупнейшая группа, но наименее информативная: 83 из 235 ответов состоят из 1–3 слов. Это артефакт формулировок анкеты, а не аудитория.</div>

  <div class="mt">${quotesCard()}</div>

  <div class="grid g2 mt">
    <div class="layer l-fact"><h4>Устойчивые сегменты</h4><ul>
      <li><b>Вход в профессию</b> (A, с B — 179, 18,4%): чаще Master и Pro, реже 1С.</li>
      <li><b>Гибкая занятость</b> (D, 108, 11,1%): максимум в Pro, минимум в 1С и у Экономиста.</li>
      <li><b>Работающий: задачи «здесь и сейчас»</b> (H, 71, 7,3%): чаще 1С и Base.</li>
      <li><b>Карьерный шаг</b> (E, 69, 7,1%): ровно 6–8% в Pro, Master, 1С и у Экономиста.</li>
      <li><b>Возврат после перерыва</b> (C, 43) и <b>1С как инструмент</b> (G, 35) — узкие, но чётко очерченные; G почти целиком приходится на 1С.</li>
    </ul></div>
    <div class="layer l-int"><h4>Правила работы с сегментами</h4><ul>
      <li>A и B объединять: задача одна — выйти на работу в профессии. Наличие диплома — вопрос квалификации.</li>
      <li>H и C не объединять: у C нет текущей работы, трудоустройство ему важнее (33% против 20%).</li>
      <li>Учёт своего бизнеса (F, 49, 5,0%) — реальная задача, но ни одна заявленная траектория ей прямо не соответствует.</li>
      <li>Пересечение A и D: 28 из 108 покупателей типа D одновременно входят в профессию — сценарий Pro «вход + фриланс» в чистом виде.</li>
    </ul></div>
  </div>`;
}

/* ================= 4. СРАВНЕНИЕ ПРОДУКТОВ ================= */
const has = (arr, i) => arr.includes(i);

  return [

      ['В найме (закрытый ответ)', r => r.e === 0, ''],
      ['Не работает', r => r.e === 1, '0,183'],
      ['Свой бизнес / ИП', r => r.e === 2, '0,203'],
      ['Фриланс / аутсорс (статус)', r => r.e === 3, '']
    ]],
    ['Профессиональный контекст', [
      ['Учётная роль сейчас', r => cur.some(i => has(r.ctx, i)), '0,034*'],

      ['Перерыв или декрет', r => has(r.ctx, C.ctx_career_break) || has(r.ctx, C.ctx_parental_leave), ''],

    ['Задачи (JTBD, мультиметка)', [

      ['Удалёнка / доп. доход / на себя', r => has(r.jt, J.jtbd_flexible_income), '0,000***'],

      ['Свой бизнес', r => has(r.jt, J.jtbd_own_business), '0,103'],
      ['Укрепить компетенции', r => has(r.jt, J.jtbd_strengthen_competence), '0,002**']
    ]],

      ['Повышение / новая должность', r => has(r.ou, O.out_promotion_new_role), ''],
      ['Трудоустроиться', r => has(r.ou, O.out_employment), ''],
      ['Боль названа', r => r.pn.some(t => t !== P.pain_not_stated), '0,515'],

function secCompare() {
  CURCOL = null;
  const rs = segRows(), N = rs.length;
  const cols = S.prod.size ? [...S.prod].sort((x, y) => x - y) : [0, 1, 2, 3, 4];
  const subs = cols.map(i => inProd(rs, i));
  const unfiltered = N === NTOT;
  const span = cols.length + (unfiltered ? 2 : 1);

  const cell = (v, base, mx) => {
    const sh = base ? 100 * v / base : 0, a = .03 + .28 * (sh / mx);
    return `<td class="cell" style="background:rgba(76,91,212,${a.toFixed(3)})"><span class="n">${v}</span>${mark(v)}<span class="pc">${base ? ru(sh.toFixed(1)) + '%' : '—'}</span></td>`;
  };
  const metricRow = (label, f, p) => {
    const vals = subs.map(sub => cnt(sub, f));
    const mx = Math.max(1, ...vals.map((v, k) => subs[k].length ? 100 * v / subs[k].length : 0));
    return `<tr><td>${label}</td>${vals.map((v, k) => cell(v, subs[k].length, mx)).join('')}${unfiltered ? `<td style="color:var(--ink3)">${p || '·'}</td>` : ''}</tr>`;
  };

  const GROUPS = [['Укрупнённые сегменты', SEGL.map((l, sg) => [`<span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;background:${SEGC[sg]}"></span>${l}`, r => segOf(r) === sg, ''])]]
    .concat(CMP_METRICS());

  const toggles = GROUPS.map(([g]) =>
    `<button class="chip${S.cmpOff.has(g) ? '' : ' on'}" data-grp="${esc(g)}">${g}</button>`).join('');

  let html = '';
  GROUPS.forEach(([g, ms]) => {
    const off = S.cmpOff.has(g);
    html += `<tr class="grp"><td colspan="${span}"><button class="grptog" data-grp="${esc(g)}">${off ? '▸' : '▾'} ${g}<span style="color:var(--ink3);font-weight:400"> · ${ms.length}</span></button></td></tr>`;
    if (!off) ms.forEach(([label, f, p]) => { html += metricRow(label, f, p); });
  });

  return `
  <h2 class="shead">Сравнение продуктов</h2>
  <p class="sdesc">Чем покупатель одного продукта отличается от покупателя другого. Отвечает на вопросы: где аудитория старше, где больше новичков, где чаще работают по найму, где сильнее просят помощь с трудоустройством — и какие из этих различий настоящие, а какие случайные.<span class="q" tabindex="0" data-tip="Столбцы — выбранные продукты, блоки показателей сворачиваются. В ячейке: число анкет и доля от числа покупателей продукта. Столбец «χ², p» показывает, устойчиво ли различие: * p < 0,05, ** p < 0,01, *** p < 0,001; точка означает, что проверка не проводилась. Проверено несколько десятков показателей, поэтому отдельные p около 0,02–0,05 могут быть случайными. Фильтр по типу покупателя здесь не применяется.">?</span></p>

  <div class="frow" style="margin-bottom:8px">
    <span class="fgroup"><span class="flabel">Продукты</span>
    ${PNAME.map((l, i) => `<button class="chip p${i}${S.prod.has(i) || !S.prod.size ? ' on' : ''}" data-f="prod" data-v="${i}">${l}</button>`).join('')}</span>
    <button class="linkbtn" data-cmp="1">Только Base / Pro / Master</button>
    ${S.prod.size ? '<button class="linkbtn" data-cmp="0">Все пять</button>' : ''}
  </div>
  <div class="frow" style="margin-bottom:14px">
    <span class="flabel">Блоки</span>${toggles}
  </div>

  <div class="card">
    <div class="ctitle">Показатели по продуктам</div>
    <div class="cbase">База каждого столбца — все анкеты продукта в срезе${N !== NTOT ? `; всего в срезе ${N} анкет` : ''}</div>

function critTable(groups, rs, label) {
  const total = rs.length;
  const head = groups.map(g => `<th${g.color ? ` style="color:${g.color}"` : ''}>${g.name}<br><span style="font-weight:400">n=${g.rows.length}</span></th>`).join('');
  const body = CRIT_ORDER.map(ci => {
    const all = cnt(rs, r => has(r.c, ci));
    const vals = groups.map(g => g.rows.length ? cnt(g.rows, r => has(r.c, ci)) : 0);
    const shares = groups.map((g, k) => g.rows.length ? 100 * vals[k] / g.rows.length : 0);
    const mx = Math.max(1, ...shares);
    return `<tr><td>${CRIT_SHORT[ci]}</td><td style="color:var(--ink3)"><span class="n">${all}</span><span class="pc">${pct(all, total)}</span></td>` +
      groups.map((g, k) => {
        const a = .03 + .30 * (shares[k] / mx);
        return `<td class="cell" style="background:rgba(76,91,212,${a.toFixed(3)})"><span class="n">${vals[k]}</span>${mark(vals[k])}<span class="pc">${g.rows.length ? ru(shares[k].toFixed(0)) + '%' : '—'}</span></td>`;
      }).join('') + '</tr>';
  }).join('');
  return `<table><thead><tr><th>${label}</th><th>Все<br><span style="font-weight:400">n=${total}</span></th>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

/* ================= КАРЬЕРНЫЕ ТРАЕКТОРИИ ПРОДУКТОВ ================= */
function secTraj() {
  CURCOL = null;
  const rs = baseRows();
  const O = IX.out, C = IX.car;
  const freelance = r => has(r.ou, O.out_clients_self_employed) || has(r.cd, C.car_self_employed);
  const remote = r => has(r.ou, O.out_remote_work) || has(r.cd, C.car_remote);
  const extra = r => has(r.ou, O.out_extra_income) || has(r.cd, C.car_extra_income);

  const fr = PNAME.map((l, i) => {
    const s = inProd(rs, i), n = s.length;
    const a = cnt(s, freelance), b = cnt(s, remote), c = cnt(s, extra);
    return `<tr><td style="color:${PCOL[i]}"><b>${l}</b></td><td>${n}</td>
      <td><span class="n">${a}</span>${mark(a)}<span class="pc">${pct(a, n)}</span></td>
      <td><span class="n">${b}</span>${mark(b)}<span class="pc">${pct(b, n)}</span></td>
      <td><span class="n">${c}</span>${mark(c)}<span class="pc">${pct(c, n)}</span></td></tr>`;
  }).join('');

  const cards = TRAJ.map(t => {
    const s = inProd(rs, t.p), n = s.length;
    const jt = cMulti(s, 'jt', D.jtbd.keys.length);
    const top = jt.map((v, i) => ({ v, i })).sort((a, b) => b.v - a.v).slice(0, 4)
      .filter(x => x.v > 0)
      .map(x => `<span class="pill">${esc(D.jtbd.labels[x.i])} — ${x.v}${mark(x.v)} · ${pct(x.v, n)}</span>`).join(' ');
    return `<div class="card">
      <div class="hd"><h3 style="color:${PCOL[t.p]}">${esc(PFULL[t.p])}</h3><span class="pill ${t.verdict[0]}">${t.verdict[1]}</span></div>

        <div class="k">Заданная траектория</div><div class="v">${t.strategy} <span class="pill">стратегия</span></div>
        <div class="k">Что подтверждают анкеты</div><div class="v">${t.fact}</div>
        <div class="k">Где траектория не видна</div><div class="v">${t.gap}</div>
        <div class="k">Фактические JTBD в срезе</div><div class="v">${top || '<span class="hint">нет анкет в срезе</span>'}<div class="hint">База: ${n} анкет продукта</div></div>
      </div></div>`;
  }).join('');

  return `

  <div class="note"><b>Удалёнка и подработка — не фриланс.</b> Исследование отдельно фиксирует: работу на себя со своими клиентами покупатели называют прямо крайне редко. Удалённый формат и дополнительный доход в доказанную модель самостоятельной работы с клиентами не объединяются — это разные показатели, и ниже они показаны раздельно.</div>

}

      <ul style="margin:0;padding-left:16px;font-size:12.5px;line-height:1.6;color:var(--ink2)">
        <li>Разметка одним кодировщиком; человеческая проверка 49 анкет не завершена.</li>
        <li>Base (N = 49) и Экономист (N = 73) — только описательно.</li>
        <li>Анкеты заполняют уже купившие: о тех, кто не купил, данных нет.</li>
        <li>Программы курсов, лендинги и скрипты продаж в исследовании не анализировались.</li>
        <li>Темы, требования к курсу и медиа размечены словарями и неточны.</li>
      </ul></div>
  </div>`;
}

/* ================= РОУТИНГ ================= */
const SECTIONS = [
  ['overview', 'Обзор линейки', secOverview],
  ['portrait', 'Портрет продукта', secPortrait],
  ['segments', 'Портреты аудитории', secSegments],
  ['types', 'Типы покупателей', secTypes],
  ['compare', 'Сравнение продуктов', secCompare],
  ['criteria', 'Критерии выбора', secCriteria],
  ['traj', 'Карьерные траектории', secTraj],
  ['impl', 'Продуктовые выводы', secImpl]
];
function renderNav() {
  document.getElementById('nav').innerHTML = SECTIONS.map(([id, t], i) =>
    `<button class="${S.sec === id ? 'on' : ''}" data-sec="${id}"><span class="ix">${i + 1}</span>${t}</button>`).join('');
}
function render() {
  renderNav(); renderFilters();
  const s = SECTIONS.find(x => x[0] === S.sec);
  document.getElementById('view').innerHTML = s[2]();
}

/* ================= ПОДСКАЗКИ ================= */
const TIP = document.createElement('div');
TIP.id = 'tip';
document.body.appendChild(TIP);
function showTip(el) {
  TIP.textContent = el.dataset.tip;
  TIP.classList.add('on');
  const r = el.getBoundingClientRect();
  TIP.style.left = '0px'; TIP.style.top = '0px';
  const w = TIP.offsetWidth, h = TIP.offsetHeight;
  let l = Math.min(r.left - 6, window.innerWidth - w - 12);
  let t = r.bottom + 8;
  if (t + h > window.innerHeight - 8) t = Math.max(8, r.top - h - 8);
  TIP.style.left = Math.max(12, l) + 'px';
  TIP.style.top = t + 'px';
}
const hideTip = () => TIP.classList.remove('on');
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
document.addEventListener('focusout', hideTip);
window.addEventListener('scroll', hideTip, true);

/* ================= СОБЫТИЯ ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-sec],[data-f],[data-portrait],[data-segview],[data-cmp],[data-qnext],[data-grp]');
  if (!t) return;
  hideTip();
  if (t.dataset.qnext) { S.qpage++; render(); return; }
  if (t.dataset.sec) { S.sec = t.dataset.sec; window.scrollTo(0, 0); render(); return; }
  if (t.dataset.portrait !== undefined) { S.portrait = +t.dataset.portrait; S.prod = new Set([S.portrait]); S.qpage = 0; render(); return; }
  if (t.dataset.segview !== undefined) {
    S.segview = +t.dataset.segview; S.seg = new Set([S.segview]); S.qpage = 0;
    [...S.bt].forEach(i => { if (SEGOF[i] !== S.segview) S.bt.delete(i); });
    render(); return;
  }
  if (t.dataset.grp !== undefined) {
    const g = t.dataset.grp;
    S.cmpOff.has(g) ? S.cmpOff.delete(g) : S.cmpOff.add(g);
    render(); return;
  }
  if (t.dataset.cmp !== undefined) {
    S.prod = t.dataset.cmp === '1' ? new Set([1, 2, 3]) : new Set();
    if (S.prod.size === 1) S.portrait = [...S.prod][0];
    render(); return;
  }
  const f = t.dataset.f, v = +t.dataset.v;
  S.qpage = 0;
  if (f === 'reset') { S.prod.clear(); S.bt.clear(); S.seg.clear(); S.age.clear(); S.emp.clear(); S.quality = false; render(); return; }
  if (f === 'quality') { S.quality = !S.quality; render(); return; }
  if (f === 'seg') {
    S.seg.has(v) ? S.seg.delete(v) : S.seg.add(v);
    if (S.seg.size) [...S.bt].forEach(i => { if (!S.seg.has(SEGOF[i])) S.bt.delete(i); });
    S.segview = S.seg.size === 1 ? [...S.seg][0] : S.segview;
    render(); return;
  }
  if (f === 'prod') {
    S.prod.has(v) ? S.prod.delete(v) : S.prod.add(v);
    if (S.prod.size === 1) S.portrait = [...S.prod][0];
    render(); return;
  }
  if (f === 'age') { S.age.has(v) ? S.age.delete(v) : S.age.add(v); render(); }
});
document.addEventListener('change', e => {
  const i = e.target.closest('input[data-f]');
  if (!i) return;
  const open = i.closest('details') ? i.closest('details').id : null;
  const f = i.dataset.f, v = +i.dataset.v, set = f === 'bt' ? S.bt : S.emp;
  i.checked ? set.add(v) : set.delete(v);
  S.qpage = 0;
  render();
  if (open) { const d = document.getElementById(open); if (d) d.open = true; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTip(); document.querySelectorAll('details[open]').forEach(d => d.open = false); } });

render();

</script>
</body>
</html>
